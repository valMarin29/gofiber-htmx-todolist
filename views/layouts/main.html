<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de tareas</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.5rem; }
    form { margin: 12px 0; }
    input, textarea, button { font: inherit; padding: 6px 8px; }
    input[type=text], input[type=email], input[type=password], textarea { width: 100%; box-sizing: border-box; margin: 4px 0; }
    .error { color: #b00020; }
    .info { color: #006400; }
    ul { list-style: none; padding: 0; }
    li { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin: 8px 0; }
    li.done .titulo { text-decoration: line-through; color: #777; }
    .acciones { display: flex; gap: 6px; margin-top: 6px; }
    header { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  {{embed}}
</body>
</html>
